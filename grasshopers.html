<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>О Кузнечиках</title>
    <link rel="stylesheet" href="./style.css" />
    <style>
      HTML {
        background-repeat: no-repeat;
        background-position: 50% 0;
        /* Mobile layout by default */
        background-image: url("./assets/img/Grasshopers/Group 1.png");
      }
    </style>
    <link href="../node_modules/pixel-glass/styles.css" rel="stylesheet" />
    <script src="../node_modules/pixel-glass/script.js"></script>
  </head>
  <body class="times-new-roman">
    <!--Секция №1-->
    <section
      class="bg-[url('./assets/img/Grasshopers/grasshopers-1-block-bg.png')] bg-cover bg-no-repeat px-[6.75rem] pb-[16.1875rem] pt-[18.75rem]"
    >
      <div class="flex flex-row justify-end">
        <div class="flex flex-col items-center gap-[6.625rem] text-center">
          <div class="flex flex-col">
            <h1
              class="text-[4.5rem] leading-[4.5rem] text-[#FFDFA5] opacity-100 [text-shadow:_-0.125rem_0.25rem_0.25rem_#000000]"
            >
              «О Кузнечиках»
            </h1>
            <p
              class="text-[2.375rem] leading-[5.4625rem] text-[#FFDFA5] [text-shadow:_0.125rem_0.125rem_0.1875rem_#000000]"
            >
              Франц Вертфоллен
            </p>
          </div>
          <button
            class="flex w-fit flex-row gap-[1.5625rem] rounded-[2.4375rem] bg-[#FFE6BA] bg-opacity-[78%] px-6 py-3 [box-shadow:_0_0_0.9375rem_0.6875rem_rgba(0,0,0,0.5)] [text-shadow:_0_0_0.625rem_rgba(0,0,0,0.3)]"
          >
            <!--Картинка корзины маловата по сравнению с макетом-->
            <img
              class="h-[3.5rem] w-[3.9375rem]"
              src="./assets/img/Grasshopers/grasshoppers-1-block-cart.svg"
              alt=""
            />
            <span
              class="text-[3.3125rem] leading-[3.5rem] [text-shadow:_0_0_0.625rem_rgba(0,_0,_0,_0.3)]"
              >В КОРЗИНУ</span
            >
          </button>
        </div>
      </div>
    </section>

    <!--Секция №2-->
    <section
      class="bg-[url('./assets/img/Grasshopers/grasshopers-2-block-bg.png')] py-[0.9375rem]"
    >
      <h2
        class="text-center text-[3.9375rem] leading-[3.5625rem] text-[#FFDFA5] [text-shadow:_0.3125rem_-0.25rem_0.1875rem_rgba(0,_0,_0,_0.59)]"
      >
        Что вы найдёте в <br />
        книге...
      </h2>
    </section>

    <!--Секция №3-->
    <section>
      <h2>Муравей</h2>
      <h3>крайне буддийская притча</h3>
    </section>
  </body>
</html>
